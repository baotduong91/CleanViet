[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanviet"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "sqlalchemy[asyncio]>=2.0.36,<2.1", "asyncpg>=0.30,<1", "pydantic-settings>=2.6,<3", "pgvector>=0.3.6,<1", "httpx>=0.28,<1"]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "httpx>=0.28,<1", "pytest-asyncio>=0.25,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.scripts]
build = "python build_vercel.py"
